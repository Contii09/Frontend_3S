{% extends 'base.html' %}

{% block conteudo %}

<div class="card_login">
    <div class="central d-flex justify-content-center align-items-center">
        <div class="modal-body">

            <h2 class="text-center">LOGIN</h2>
            <form id="form-login" class="d-flex flex-column" action="{{ url_for('login') }}" method="post">
                <label>
                    Email:
                    <input id="input-email" placeholder="Digite o email" name="form-email" class="form-control w-100">
                </label>
                <label>
                    Senha:
                    <input id="input-senha" placeholder="Digite a Senha " name="form-senha" class="form-control w-100">
                </label>

                <button type="submit" class="btn btn-info">Entrar</button>
                <a class="btn btn-danger" onclick="limpaInputsLogin()">Cancelar</a>
            </form>

            <!-- Button trigger modal -->
            <p class="small">Ainda não tem uma conta? <a data-bs-toggle="modal" data-bs-target="#staticBackdrop"
                                                         href="">Cadastre-se</a></p>


            <!-- Modal -->
            <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
                 aria-labelledby="staticBackdropLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="form-cadastro" class="form-somar" action="{{ url_for('cadastro_funcionario') }}"
                                  method="post">
                                <label>
                                    Nome:
                                    <input id="form-nome"placeholder="Digite o Nome" name="form-nome" class="form-control">
                                </label>
                                <label>
                                    Data de nascimento:
                                    <input id="form-nascimento" placeholder="Digite a Data de Nascimento" name="from-date"
                                           class="form-control" type="date">
                                </label>
                                <label>
                                    CPF:
                                    <input id="form-cpf" placeholder="Digite o CPF" name="form-cpf"
                                           class="form-control">
                                </label>
                                <label>
                                    Email:
                                    <input id="form-emaill" placeholder="Digite o Email" name="form-email"
                                           class="form-control"
                                           type="email">
                                </label>
                                <label>
                                    Senha:
                                    <input id="form-senhaa" placeholder="Digite a Senha" name="form-senha"
                                           class="form-control">
                                </label>
                                <label>
                                    Cargo:
                                    <input id="form-cargo" placeholder="Digite o Cargo" name="form-cargo"
                                           class="form-control">
                                </label>
                                <label>
                                    Salário:
                                    <input id="form-salario" placeholder="Digite o Salário" name="form-salario"
                                           class="form-control">
                                </label>


                                <button type="submit" class="btn btn-info">Cadastrar</button>
                            </form>
                            ...
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
                            <a class="btn btn-danger" onclick="limpaInputsCadastro()">Cancelar</a>


                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


{% endblock %}
