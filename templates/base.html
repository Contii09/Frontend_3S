<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Frontend</title>
    <!--  link do bootstrap - antes do css  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--  link do bootstrap incons  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--  link do css  -->
    <link rel="stylesheet" href="/static/css/style.css"/>
    <!--  link da font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bitcount+Prop+Double+Ink:wght@100..900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bitcount+Ink:wght@100..900&family=Bitcount+Prop+Double+Ink:wght@100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap"
          rel="stylesheet">

</head>
<body>
<div class="menu">
    <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a href="{{ url_for('calculos') }}">Cálculos</a></li>
        <li><a href="{{ url_for('funcionarios') }}">Funcionários</a></li>
        <li><a href="{{ url_for('animais') }}">Animais</a></li>

        {% if current_user.is_authenticated %}
        <li>
            <a href="#" data-bs-toggle="modal" data-bs-target="#logoutModal">
                {{ current_user.nome }}
            </a>
        </li>

        <!-- Modal -->
        <div class="modal fade" id="logoutModal" data-bs-backdrop="static"
             data-bs-keyboard="false" tabindex="-1"
             aria-labelledby="logoutModal" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="logoutModalLabel">
                            Confirmar Logout
                        </h1>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <p>Deseja sair da sua conta?</p>
                    </div>

                    <div class="modal-footer">

                        <!-- Botão Cancelar -->
                        <button type="button"
                                class="btn btn-secondary"
                                data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <!-- Botão Confirmar Logout -->
                        <form action="{{ url_for('logout') }}" method="post">
                            <button type="submit"
                                    class="btn btn-danger">
                                <i class="bi bi-box-arrow-right"></i> Sair
                            </button>
                        </form>

                    </div>

                </div>
            </div>
        </div>
        {% else %}
        <li><a href="{{ url_for('login') }}">Login</a></li>
        {% endif %}
    </ul>
</div>

{% block conteudo %}
{% endblock %}

<!--  link do Javascript para o bootstrap - Final do Body  -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<script src="/static/js/verificacoes.js"></script>
<script src="/static/js/apis.js"></script>
</body>
</html>
